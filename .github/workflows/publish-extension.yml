name: Publish Extension

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: buildandreleasetask/package-lock.json
      
      - name: Install dependencies and build task
        working-directory: buildandreleasetask
        run: npm run build
      
      - name: Install TFX CLI
        run: npm install -g tfx-cli
      
      - name: Package extension
        run: |
          mkdir -p ./out
          tfx extension create --manifest-globs vss-extension.json --output-path ./out
          ls -lh ./out/*.vsix
      
      - name: Publish extension
        run: tfx extension publish --vsix ./out/*.vsix --auth-type pat --token ${{ secrets.MARKETPLACE_PAT }}
